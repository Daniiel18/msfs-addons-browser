[package]
name = "msfs-addons-browser"
version = "0.1.13"
description = "MSFS Addons Browser — search and install scenery from SceneryAddons & Simplaza"
authors = ["n0xful"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "msfs_addons_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
# Selector de archivos nativo para el instalador manual ("Instalar desde
# archivo…"). Usado sólo desde el frontend — aquí lo registramos para
# que exista el endpoint IPC correspondiente.
tauri-plugin-dialog = "2"
# Autostart con el SO — usado por la sección «Settings» para que el
# usuario active "arrancar con Windows". El plugin maneja la entrada
# en `HKEY_CURRENT_USER\…\Run` automáticamente.
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"

# TLS: use the OS-native backend (schannel on Windows, Secure Transport on
# macOS). Avoids pulling in aws-lc-sys — which needs NASM at build time on
# Windows — via librqbit's transitive rustls dep.
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "gzip", "brotli", "stream", "cookies"] }
scraper = "0.20"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

zip = { version = "2", default-features = false, features = ["deflate"] }
# Walker recursivo para zip de la carpeta Community en backup —
# evita el ruido de glob/find a mano y respeta enlaces simbólicos.
walkdir = "2"
# Descompresores para los formatos que la escena MSFS usa más:
#   · RAR — la mayoría de torrents de SceneryAddons/Simplaza llegan así.
#     `unrar` envuelve el código C de RARLAB y maneja volúmenes
#     múltiples (foo.part1.rar + foo.part2.rar…) automáticamente.
#   · 7z  — ocasional pero común en paquetes grandes. `sevenz-rust2` es
#     un fork puro-Rust, activo y sin dependencias nativas.
unrar = "0.5"
sevenz-rust2 = "0.13"
tempfile = "3"

# Embedded BitTorrent client. Using default TLS (via reqwest/default-tls)
# keeps us on schannel on Windows — the `rust-tls` feature pulls in
# rustls → aws-lc-sys, which requires NASM at build time on Windows.
librqbit = { version = "8", default-features = false, features = ["default-tls"] }
tokio-util = { version = "0.7", features = ["rt"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

anyhow = "1"
thiserror = "1"
regex = "1"
once_cell = "1"
# Encoding de thumbnails en data URLs (`data:image/jpeg;base64,...`).
# Evita los problemas de scope del asset protocol con paths
# arbitrarios en la carpeta Community.
base64 = "0.22"
# Comparación de versiones para el chequeo de actualizaciones — el tag
# de GitHub se parsea con `Version::parse` y se compara contra
# `CARGO_PKG_VERSION`. Standard de facto en el ecosistema Rust.
semver = "1"
# Parser CSV streaming para bajar y digerir el dataset de OurAirports
# (https://davidmegginson.github.io/ourairports-data/airports.csv).
# ~80k filas, ~7MB; en streaming es trivial.
csv = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tracing-appender = "0.2"

# Detector de procesos para saber si MSFS está corriendo. Lo
# usamos como fallback rápido (proceso detectado) y para saber
# cuándo arrancar el FFI a SimConnect.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# `libloading` carga `SimConnect.dll` en runtime sin necesidad de
# bindgen/libclang en build — escribimos a mano las pocas signatures
# que usamos. Cross-platform pero la implementación SimConnect sólo
# se compila en Windows.
libloading = "0.8"

[features]
custom-protocol = ["tauri/custom-protocol"]

# SimConnect — sólo Windows. El crate `simconnect-sdk` carga la
# `SimConnect.dll` que viene con MSFS en runtime; no añade nada al
# binario en otras plataformas (sólo se compila si target_os=windows).
# Si la dll no está al ejecutar, `SimConnect::new()` falla y el
# watcher queda en `Disconnected` reintentando — la app no se rompe.
