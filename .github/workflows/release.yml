name: Release

# On a pushed version tag (e.g. v7.4.0) this drafts a GitHub Release with
# the notes pulled straight from CHANGELOG.md, so the release page never
# drifts from the docs. The installer is built locally (see
# scripts/build-release.ps1) and attached to the draft before publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to draft a release for (e.g. v7.4.0)"
        required: true

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag / version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify version files match the tag
        run: |
          version="${{ steps.v.outputs.version }}"
          fail=0
          check() {
            if ! grep -q "$2" "$1"; then
              echo "::error file=$1::expected version $version ($2) not found in $1"
              fail=1
            fi
          }
          check package.json "\"version\": \"$version\""
          check src-tauri/tauri.conf.json "\"version\": \"$version\""
          check src-tauri/Cargo.toml "version = \"$version\""
          if [ "$fail" = "1" ]; then
            echo "Version files are out of sync with tag ${{ steps.v.outputs.tag }}."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.v.outputs.version }}"
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Create or update the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: SimFleet ${{ steps.v.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false
