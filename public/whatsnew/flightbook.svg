<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#g4)" opacity="0.5"/>
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a432b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <text x="40" y="56" fill="#e2e8f0" font-size="18" font-weight="700">Bitácora de vuelos</text>

  <!-- fila de vuelo -->
  <g transform="translate(40,80)">
    <rect width="560" height="92" rx="14" fill="#1e293b" stroke="#1ea45d" stroke-width="1.5"/>
    <g transform="translate(20,20)">
      <rect width="52" height="52" rx="10" fill="#0f172a" stroke="#475569"/>
      <path d="M8 30 L44 30 M36 22 L46 30 L36 38" stroke="#3fbf78" stroke-width="3" fill="none"/>
    </g>
    <text x="88" y="38" fill="#e2e8f0" font-size="16" font-weight="700">KJFK → KLAX</text>
    <text x="88" y="60" fill="#94a3b8" font-size="13">Boeing 737-800 · American Airlines · N404DX</text>
    <!-- block time -->
    <g transform="translate(400,18)">
      <text x="0" y="14" fill="#64748b" font-size="11">BLOCK TIME</text>
      <text x="0" y="40" fill="#3fbf78" font-size="22" font-weight="700">05:42</text>
    </g>
  </g>

  <!-- detalle: cierre por apagado real de motores -->
  <g transform="translate(40,196)">
    <rect width="270" height="120" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="32" fill="#cbd5e1" font-size="13" font-weight="600">Cierre por apagado real</text>
    <!-- gauge N2 -->
    <g transform="translate(20,48)">
      <path d="M10 50 A45 45 0 0 1 100 50" fill="none" stroke="#0f172a" stroke-width="10"/>
      <path d="M10 50 A45 45 0 0 1 22 18" fill="none" stroke="#3fbf78" stroke-width="10" stroke-linecap="round"/>
      <text x="55" y="46" fill="#e2e8f0" font-size="18" font-weight="700" text-anchor="middle">N2</text>
      <text x="55" y="64" fill="#3fbf78" font-size="13" text-anchor="middle">&lt; 5%</text>
    </g>
    <text x="140" y="70" fill="#94a3b8" font-size="12">Espera al</text>
    <text x="140" y="88" fill="#94a3b8" font-size="12">apagado real,</text>
    <text x="140" y="106" fill="#94a3b8" font-size="12">no al fuel cutoff.</text>
  </g>

  <!-- detalle: fabricante / aerolínea reales -->
  <g transform="translate(330,196)">
    <rect width="270" height="120" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="32" fill="#cbd5e1" font-size="13" font-weight="600">Datos reales del avión</text>
    <g transform="translate(20,48)">
      <rect width="230" height="26" rx="6" fill="#0f172a"/>
      <text x="10" y="18" fill="#64748b" font-size="11">Fabricante</text>
      <text x="220" y="18" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="end">Boeing</text>
    </g>
    <g transform="translate(20,80)">
      <rect width="230" height="26" rx="6" fill="#0f172a"/>
      <text x="10" y="18" fill="#64748b" font-size="11">Aerolínea</text>
      <text x="220" y="18" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="end">American Airlines</text>
    </g>
  </g>
</svg>
