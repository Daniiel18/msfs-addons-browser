<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="sw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="sw-w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/><stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#sw-bg)"/>

  <g transform="translate(28,26)">
    <text x="0" y="12" fill="#e2e8f0" font-size="16" font-weight="700">Presume tus vuelos: tarjeta compartible + Wrapped anual</text>
    <text x="0" y="31" fill="#64748b" font-size="11">Copia la imagen o guárdala como PNG · y exporta tu FlightBook a una web para compartir</text>
  </g>

  <!-- tarjeta de vuelo -->
  <g transform="translate(48,70)">
    <rect width="270" height="258" rx="16" fill="#0b1220" stroke="#1e293b"/>
    <text x="20" y="34" fill="#e2e8f0" font-size="14" font-weight="800">SimFleet</text>
    <text x="20" y="96" fill="#f8fafc" font-size="40" font-weight="800">LEMD</text>
    <text x="250" y="96" fill="#f8fafc" font-size="40" font-weight="800" text-anchor="end">LEBL</text>
    <line x1="30" y1="120" x2="240" y2="120" stroke="#38bdf8" stroke-width="2.4" stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle cx="30" cy="120" r="5" fill="#38bdf8"/><circle cx="240" cy="120" r="5" fill="#818cf8"/>
    <g transform="translate(20,150)">
      <text x="0" y="0" fill="#64748b" font-size="9">DISTANCIA</text><text x="0" y="20" fill="#e2e8f0" font-size="16" font-weight="700">261 NM</text>
      <text x="150" y="0" fill="#64748b" font-size="9">DURACIÓN</text><text x="150" y="20" fill="#e2e8f0" font-size="16" font-weight="700">0h 58m</text>
    </g>
    <g transform="translate(20,196)">
      <rect width="230" height="44" rx="10" fill="#0b1424" stroke="#1e293b"/>
      <text x="14" y="19" fill="#64748b" font-size="9">ATERRIZAJE</text>
      <text x="14" y="36" fill="#e2e8f0" font-size="15" font-weight="800">-142 fpm</text>
      <circle cx="200" cy="22" r="17" fill="none" stroke="#34d399" stroke-width="3"/>
      <text x="200" y="28" fill="#34d399" font-size="18" font-weight="800" text-anchor="middle">A</text>
    </g>
  </g>

  <!-- tarjeta wrapped -->
  <g transform="translate(340,70)">
    <rect width="252" height="258" rx="16" fill="url(#sw-w)" stroke="#4c1d95"/>
    <text x="20" y="30" fill="#c4b5fd" font-size="11" font-weight="800" letter-spacing="1.5">SIMFLEET</text>
    <text x="20" y="62" fill="#f8fafc" font-size="28" font-weight="800">Wrapped</text>
    <text x="20" y="88" fill="#f8fafc" font-size="28" font-weight="800">2026</text>
    <g transform="translate(20,108)">
      <rect width="212" height="90" rx="12" fill="#150f33" stroke="#4c1d95"/>
      <text x="56" y="40" fill="#f8fafc" font-size="26" font-weight="800" text-anchor="middle">128</text>
      <text x="56" y="58" fill="#c4b5fd" font-size="9" text-anchor="middle">VUELOS</text>
      <text x="156" y="40" fill="#f8fafc" font-size="26" font-weight="800" text-anchor="middle">214h</text>
      <text x="156" y="58" fill="#c4b5fd" font-size="9" text-anchor="middle">HORAS</text>
    </g>
    <text x="20" y="222" fill="#c4b5fd" font-size="10">DESTINO FAVORITO</text>
    <text x="20" y="242" fill="#f1f5f9" font-size="16" font-weight="700">LEBL · Barcelona</text>
  </g>
</svg>
