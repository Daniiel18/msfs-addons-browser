<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="tr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a08" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#tr-bg)"/>

  <!-- bell -->
  <g transform="translate(96,150)">
    <path d="M0 0 a34 34 0 0 1 68 0 v20 l12 18 H-12 l12 -18 z" fill="none" stroke="#fbbf24" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M24 44 a10 10 0 0 0 20 0" fill="none" stroke="#fbbf24" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="58" cy="2" r="15" fill="#f43f5e"/>
    <text x="58" y="8" fill="#fff" font-size="17" font-weight="800" text-anchor="middle">2</text>
  </g>

  <!-- dropdown panel -->
  <g transform="translate(220,54)">
    <rect width="360" height="252" rx="16" fill="#0b1220" stroke="#1e293b"/>
    <text x="20" y="34" fill="#e2e8f0" font-size="14" font-weight="700">Notifications</text>
    <line x1="0" y1="48" x2="360" y2="48" stroke="#1e293b"/>

    <!-- update row 1 (flightsim.to) -->
    <g transform="translate(0,48)">
      <rect width="360" height="72" fill="#0ea5e9" opacity="0.08"/>
      <rect x="18" y="18" width="34" height="34" rx="9" fill="#0ea5e9" opacity="0.2"/>
      <path d="M35 26 v14 m-6 -6 l6 6 l6 -6" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="34" fill="#bae6fd" font-size="12.5" font-weight="700">flightsim.to</text>
      <text x="66" y="52" fill="#7dd3fc" font-size="10.5">EHAM · MK-Studios</text>
      <g transform="translate(250,26)">
        <rect width="90" height="22" rx="6" fill="#0ea5e9" opacity="0.18"/>
        <text x="45" y="15" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">v1.0 → v1.2</text>
      </g>
    </g>
    <line x1="0" y1="120" x2="360" y2="120" stroke="#1e293b"/>

    <!-- update row 2 -->
    <g transform="translate(0,120)">
      <rect x="18" y="18" width="34" height="34" rx="9" fill="#0ea5e9" opacity="0.14"/>
      <path d="M35 26 v14 m-6 -6 l6 6 l6 -6" stroke="#38bdf8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="34" fill="#cbd5e1" font-size="12.5" font-weight="700">flightsim.to</text>
      <text x="66" y="52" fill="#64748b" font-size="10.5">KLAX · FlyTampa</text>
      <g transform="translate(250,26)">
        <rect width="90" height="22" rx="6" fill="#0ea5e9" opacity="0.12"/>
        <text x="45" y="15" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">v2.1 → v2.2</text>
      </g>
    </g>
    <line x1="0" y1="192" x2="360" y2="192" stroke="#1e293b"/>
    <text x="20" y="222" fill="#475569" font-size="10.5">Click → flightsim.to</text>
  </g>
</svg>
