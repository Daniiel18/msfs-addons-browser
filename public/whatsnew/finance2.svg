<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="f2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2e43" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="f2-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#f2-bg)"/>

  <!-- header -->
  <g transform="translate(28,26)">
    <rect width="22" height="22" rx="5" fill="#0ea5e9" opacity="0.25"/>
    <path d="M5 17 v-6 M10 17 v-10 M15 17 v-4" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="32" y="12" fill="#e2e8f0" font-size="16" font-weight="700">Finanzas con más detalle</text>
    <text x="32" y="29" fill="#64748b" font-size="11">Histórico del saldo, ranking de aerolíneas y servicios a bordo automáticos</text>
  </g>

  <!-- balance history card -->
  <g transform="translate(28,74)">
    <rect width="360" height="240" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <text x="16" y="26" fill="#cbd5e1" font-size="12" font-weight="700">Histórico del saldo</text>
    <text x="344" y="26" fill="#64748b" font-size="10" text-anchor="end">El banco, vuelo a vuelo</text>
    <!-- grid -->
    <g stroke="#1e293b" stroke-width="1">
      <line x1="16" y1="70" x2="344" y2="70"/><line x1="16" y1="120" x2="344" y2="120"/><line x1="16" y1="170" x2="344" y2="170"/>
    </g>
    <!-- reference line (valuation) -->
    <line x1="16" y1="62" x2="344" y2="62" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- area + curve: starts high, steps down (fleet purchases), recovers -->
    <path d="M16 62 L70 62 L96 96 L122 120 L148 138 L174 150 L200 150 L240 146 L290 142 L344 138 L344 210 L16 210 Z" fill="url(#f2-area)"/>
    <path d="M16 62 L70 62 L96 96 L122 120 L148 138 L174 150 L200 150 L240 146 L290 142 L344 138" fill="none" stroke="#34d399" stroke-width="2"/>
    <g fill="#475569" font-size="9">
      <text x="16" y="226">Feb</text><text x="120" y="226">Mar</text><text x="220" y="226">Abr</text><text x="320" y="226">May</text>
    </g>
  </g>

  <!-- ranking card -->
  <g transform="translate(404,74)">
    <rect width="208" height="240" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <text x="16" y="26" fill="#cbd5e1" font-size="12" font-weight="700">Ranking</text>
    <g transform="translate(16,40)">
      <!-- gold -->
      <rect width="176" height="44" rx="10" fill="#0f1a2e"/>
      <circle cx="22" cy="22" r="11" fill="#fbbf24"/><text x="22" y="26" fill="#1c1917" font-size="11" font-weight="800" text-anchor="middle">1</text>
      <text x="42" y="19" fill="#94a3b8" font-size="9">MÁS RENTABLE</text>
      <text x="42" y="34" fill="#e2e8f0" font-size="11" font-weight="700">Delta Air Lines</text>
      <text x="168" y="28" fill="#34d399" font-size="11" font-weight="800" text-anchor="end">+$3.2M</text>
    </g>
    <g transform="translate(16,92)">
      <rect width="176" height="44" rx="10" fill="#0f1a2e"/>
      <circle cx="22" cy="22" r="11" fill="#cbd5e1"/><text x="22" y="26" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">2</text>
      <text x="42" y="19" fill="#94a3b8" font-size="9">MEJOR MARGEN</text>
      <text x="42" y="34" fill="#e2e8f0" font-size="11" font-weight="700">Ryanair</text>
      <text x="168" y="28" fill="#34d399" font-size="11" font-weight="800" text-anchor="end">+27%</text>
    </g>
    <g transform="translate(16,144)">
      <rect width="176" height="44" rx="10" fill="#0f1a2e"/>
      <circle cx="22" cy="22" r="11" fill="#d97706"/><text x="22" y="26" fill="#fff7ed" font-size="11" font-weight="800" text-anchor="middle">3</text>
      <text x="42" y="19" fill="#94a3b8" font-size="9">MÁS SATISFECHOS</text>
      <text x="42" y="34" fill="#e2e8f0" font-size="11" font-weight="700">American</text>
      <text x="168" y="28" fill="#22c55e" font-size="11" font-weight="800" text-anchor="end">92%</text>
    </g>
    <g transform="translate(16,200)">
      <rect width="176" height="26" rx="8" fill="#0c4a3e" opacity="0.5"/>
      <text x="10" y="17" fill="#6ee7b7" font-size="9" font-weight="700">Servicios a bordo · Automático</text>
    </g>
  </g>
</svg>
