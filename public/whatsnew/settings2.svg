<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="st-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b3a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#st-bg)"/>

  <!-- header -->
  <g transform="translate(28,26)">
    <rect width="22" height="22" rx="5" fill="#8b5cf6" opacity="0.22"/>
    <circle cx="11" cy="11" r="5" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
    <text x="32" y="12" fill="#e2e8f0" font-size="16" font-weight="700">Ajustes reorganizados</text>
    <text x="32" y="29" fill="#64748b" font-size="11">Un menú lateral claro: cada sección a un clic, sin scroll largo</text>
  </g>

  <!-- settings modal mock -->
  <g transform="translate(64,72)">
    <rect width="512" height="252" rx="16" fill="#0b1220" stroke="#1e293b"/>
    <!-- modal header -->
    <line x1="0" y1="40" x2="512" y2="40" stroke="#1e293b"/>
    <text x="20" y="26" fill="#e2e8f0" font-size="13" font-weight="700">Ajustes</text>
    <text x="492" y="26" fill="#64748b" font-size="14" text-anchor="end">✕</text>

    <!-- sidebar -->
    <line x1="160" y1="40" x2="160" y2="252" stroke="#1e293b"/>
    <g transform="translate(12,52)" font-size="11">
      <rect width="138" height="24" rx="6" fill="#34d39820"/>
      <text x="12" y="16" fill="#6ee7b7" font-weight="700">General</text>
      <text x="12" y="44" fill="#94a3b8">Vuelos</text>
      <text x="12" y="72" fill="#94a3b8">Mapa</text>
      <text x="12" y="100" fill="#94a3b8">Carpetas</text>
      <text x="12" y="128" fill="#94a3b8">GSX Pro</text>
      <text x="12" y="156" fill="#94a3b8">Google Drive</text>
      <text x="12" y="184" fill="#94a3b8">Backup</text>
    </g>

    <!-- content -->
    <g transform="translate(180,54)">
      <text x="0" y="10" fill="#64748b" font-size="9" font-weight="700" letter-spacing="1">GENERAL</text>
      <g transform="translate(0,20)">
        <rect width="312" height="34" rx="8" fill="#0f1a2e"/>
        <text x="12" y="21" fill="#cbd5e1" font-size="11">Tema</text>
        <rect x="232" y="9" width="68" height="16" rx="8" fill="#1e293b"/><circle cx="290" cy="17" r="6" fill="#34d399"/>
      </g>
      <g transform="translate(0,62)">
        <rect width="312" height="34" rx="8" fill="#0f1a2e"/>
        <text x="12" y="21" fill="#cbd5e1" font-size="11">Idioma</text>
        <text x="300" y="21" fill="#94a3b8" font-size="10" text-anchor="end">Español</text>
      </g>
      <g transform="translate(0,104)">
        <rect width="312" height="34" rx="8" fill="#0f1a2e"/>
        <text x="12" y="21" fill="#cbd5e1" font-size="11">Versión de MSFS</text>
        <rect x="236" y="8" width="30" height="18" rx="5" fill="#0ea5e9" opacity="0.3"/><text x="251" y="21" fill="#7dd3fc" font-size="10" text-anchor="middle">2020</text>
        <rect x="270" y="8" width="30" height="18" rx="5" fill="#1e293b"/><text x="285" y="21" fill="#64748b" font-size="10" text-anchor="middle">2024</text>
      </g>
      <g transform="translate(0,146)">
        <rect width="312" height="34" rx="8" fill="#0f1a2e"/>
        <text x="12" y="21" fill="#cbd5e1" font-size="11">Unidades</text>
        <text x="300" y="21" fill="#94a3b8" font-size="10" text-anchor="end">kg · ft · kt</text>
      </g>
    </g>
  </g>
</svg>
