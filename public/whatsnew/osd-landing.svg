<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="osd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="0.6" stop-color="#0c1a2e"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="osd-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#060a12" stop-opacity="0.96"/>
    </linearGradient>
  </defs>
  <!-- "sim" backdrop -->
  <rect width="640" height="360" fill="url(#osd-sky)"/>
  <rect y="250" width="640" height="110" fill="#0a1410"/>
  <path d="M0 300 H640 M0 330 H640" stroke="#14532d" stroke-width="2" opacity="0.6"/>
  <rect x="305" y="250" width="30" height="110" fill="#1f2937" opacity="0.5"/>
  <text x="28" y="40" fill="#cbd5e1" font-size="13" font-weight="700" opacity="0.7">Microsoft Flight Simulator</text>

  <!-- header tag -->
  <g transform="translate(28,300)">
    <rect width="160" height="22" rx="11" fill="#0ea5e9" opacity="0.85"/>
    <text x="80" y="15" fill="#04212e" font-size="10" font-weight="700" text-anchor="middle">SIEMPRE ENCIMA DEL SIM</text>
  </g>

  <!-- OSD overlay -->
  <g transform="translate(186,66)">
    <rect width="268" height="200" rx="16" fill="url(#osd-card)" stroke="#1e293b"/>
    <rect width="268" height="200" rx="16" fill="none" stroke="#22c55e" stroke-opacity="0.25"/>
    <!-- title -->
    <text x="20" y="32" fill="#e2e8f0" font-size="13" font-weight="700">Aterrizaje</text>
    <rect x="178" y="18" width="72" height="20" rx="10" fill="#16a34a" opacity="0.25"/>
    <text x="214" y="32" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">MANTEQUILLA</text>
    <line x1="20" y1="46" x2="248" y2="46" stroke="#1e293b"/>
    <!-- big FPM -->
    <text x="20" y="92" fill="#4ade80" font-size="44" font-weight="800">-210</text>
    <text x="150" y="92" fill="#64748b" font-size="14" font-weight="600">fpm</text>
    <!-- metrics grid -->
    <g font-size="11" transform="translate(20,116)">
      <text x="0" y="10" fill="#64748b">Fuerza G</text><text x="110" y="10" fill="#e2e8f0" font-weight="700" text-anchor="end">1.28 g</text>
      <text x="138" y="10" fill="#64748b">Viento</text><text x="228" y="10" fill="#e2e8f0" font-weight="700" text-anchor="end">240° 8kt</text>
      <text x="0" y="34" fill="#64748b">Pitch</text><text x="110" y="34" fill="#e2e8f0" font-weight="700" text-anchor="end">+4.1°</text>
      <text x="138" y="34" fill="#64748b">Roll</text><text x="228" y="34" fill="#e2e8f0" font-weight="700" text-anchor="end">0.6°</text>
      <text x="0" y="58" fill="#64748b">GS al tocar</text><text x="110" y="58" fill="#e2e8f0" font-weight="700" text-anchor="end">134 kt</text>
      <text x="138" y="58" fill="#64748b">Centrado</text><text x="228" y="58" fill="#4ade80" font-weight="700" text-anchor="end">+1.2 m</text>
    </g>
  </g>
</svg>
