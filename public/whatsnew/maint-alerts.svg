<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ma-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2508" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#ma-bg)"/>

  <g transform="translate(28,26)">
    <rect width="22" height="22" rx="5" fill="#f59e0b" opacity="0.22"/>
    <path d="M14 5 a4.5 4.5 0 0 0 -6 6 l-4 4 2.5 2.5 4 -4 a4.5 4.5 0 0 0 6 -6 l-2.5 2.5 -2 -2 z" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="32" y="12" fill="#e2e8f0" font-size="16" font-weight="700">Mantenimiento en la campanita + economía autosostenible</text>
    <text x="32" y="29" fill="#64748b" font-size="11">Aviso al 75% · al 100% la aerolínea lo sirve sola y paga el coste</text>
  </g>

  <!-- tarjeta ámbar: próximo -->
  <g transform="translate(64,78)">
    <rect width="512" height="66" rx="12" fill="#2b1c06" stroke="#b45309"/>
    <path d="M32 22 a5 5 0 0 0 -6.5 6.5 l-5 5 3 3 5 -5 a5 5 0 0 0 6.5 -6.5 l-2.8 2.8 -2.2 -2.2 z" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="56" y="26" fill="#fcd34d" font-size="12" font-weight="700">Mantenimiento próximo</text>
    <text x="56" y="44" fill="#e2e8f0" font-size="11" font-family="monospace">XA-MAG · 737 MAX 8 — Frenos · 78%</text>
    <text x="488" y="38" fill="#64748b" font-size="14" text-anchor="end">✕</text>
  </g>

  <!-- tarjeta roja: vencido -->
  <g transform="translate(64,152)">
    <rect width="512" height="66" rx="12" fill="#2c0b12" stroke="#be123c"/>
    <path d="M32 22 a5 5 0 0 0 -6.5 6.5 l-5 5 3 3 5 -5 a5 5 0 0 0 6.5 -6.5 l-2.8 2.8 -2.2 -2.2 z" fill="none" stroke="#fda4af" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="56" y="26" fill="#fda4af" font-size="12" font-weight="700">Mantenimiento vencido</text>
    <text x="56" y="44" fill="#e2e8f0" font-size="11" font-family="monospace">XA-VDJ · A320neo — Neumáticos · 91% · +2 componentes más</text>
    <text x="488" y="38" fill="#64748b" font-size="14" text-anchor="end">✕</text>
  </g>

  <!-- auto-servicio -->
  <g transform="translate(64,236)">
    <rect width="512" height="84" rx="12" fill="#0b1a12" stroke="#15803d"/>
    <circle cx="34" cy="42" r="14" fill="#16a34a" opacity="0.2"/>
    <path d="M27 42 l5 5 9 -11" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="32" fill="#86efac" font-size="12" font-weight="700">Auto-mantenimiento (como la vida real)</text>
    <text x="60" y="50" fill="#94a3b8" font-size="10.5">Un componente al 100% no puede volar: la aerolínea lo sirve AUTOMÁTICAMENTE,</text>
    <text x="60" y="66" fill="#94a3b8" font-size="10.5">el coste entra en Finanzas y el historial queda en el Hangar. Ciclo cerrado.</text>
  </g>
</svg>
