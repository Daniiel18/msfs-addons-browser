<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#g1)" opacity="0.5"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a432b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- correo / cuenta compartida -->
  <g transform="translate(40,70)">
    <rect width="150" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="18" y="22" width="114" height="56" rx="6" fill="#0f172a" stroke="#475569"/>
    <path d="M18 28 L75 60 L132 28" fill="none" stroke="#3fbf78" stroke-width="2.5"/>
    <text x="75" y="94" fill="#94a3b8" font-size="12" text-anchor="middle">tu correo</text>
  </g>

  <!-- flecha -->
  <g transform="translate(205,118)">
    <path d="M0 2 H40" stroke="#1ea45d" stroke-width="3"/>
    <path d="M34 -5 L44 2 L34 9" fill="none" stroke="#1ea45d" stroke-width="3"/>
    <text x="22" y="-12" fill="#3fbf78" font-size="11" text-anchor="middle" font-weight="700">match</text>
  </g>

  <!-- OFP enlazado -->
  <g transform="translate(270,46)">
    <rect width="330" height="170" rx="14" fill="#1e293b" stroke="#1ea45d" stroke-width="1.5"/>
    <rect x="0" y="0" width="330" height="40" rx="14" fill="#0f693d"/>
    <rect x="0" y="20" width="330" height="20" fill="#0f693d"/>
    <text x="18" y="26" fill="#d5f5e1" font-size="14" font-weight="700">OFP enlazado automáticamente</text>
    <g transform="translate(18,58)">
      <rect width="44" height="44" rx="8" fill="#0f172a" stroke="#475569"/>
      <path d="M8 22 L36 22 M30 14 L38 22 L30 30" stroke="#3fbf78" stroke-width="3" fill="none"/>
    </g>
    <text x="74" y="74" fill="#e2e8f0" font-size="15" font-weight="600">AAL787 · KJFK → KLAX</text>
    <text x="74" y="94" fill="#94a3b8" font-size="12">B738 · American Airlines · N404DX</text>
    <rect x="18" y="116" width="294" height="34" rx="8" fill="#0a432b"/>
    <circle cx="36" cy="133" r="5" fill="#3fbf78"/>
    <text x="50" y="138" fill="#adeac5" font-size="12">refrescando cada 30s hasta el gate…</text>
  </g>

  <text x="40" y="320" fill="#64748b" font-size="13">Sin vincular planes a mano · funciona con cuenta de SimBrief compartida</text>
</svg>
