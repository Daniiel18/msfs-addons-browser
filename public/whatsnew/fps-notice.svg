<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="fn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e1f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#fn-bg)"/>

  <g transform="translate(28,26)">
    <rect width="22" height="22" rx="5" fill="#10b981" opacity="0.22"/>
    <path d="M11 18 a7 7 0 1 1 0 -14 a7 7 0 0 1 0 14 z M11 11 l4 -3" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round"/>
    <text x="32" y="12" fill="#e2e8f0" font-size="16" font-weight="700">FPS Optimization al instalar un escenario</text>
    <text x="32" y="29" fill="#64748b" font-size="11">Si el escenario nuevo trae objetos opcionales, te avisa — clic y optimizas</text>
  </g>

  <!-- tarjeta verde en campanita -->
  <g transform="translate(64,80)">
    <rect width="512" height="76" rx="12" fill="#062c1e" stroke="#059669"/>
    <circle cx="34" cy="38" r="13" fill="#10b981" opacity="0.18"/>
    <path d="M34 45 a8 8 0 1 1 0 -16 a8 8 0 0 1 0 16 z M34 37 l4.5 -3.5" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round"/>
    <text x="58" y="27" fill="#6ee7b7" font-size="12" font-weight="700">FPS Optimization disponible</text>
    <text x="58" y="45" fill="#e2e8f0" font-size="11">SamScene3D — Tokyo Haneda RJTT (recién instalado)</text>
    <text x="58" y="62" fill="#64748b" font-size="10">Objetos opcionales desactivables — clic para abrir el modal de rendimiento</text>
    <text x="490" y="42" fill="#64748b" font-size="14" text-anchor="end">✕</text>
  </g>

  <!-- modal de rendimiento mini -->
  <g transform="translate(112,172)">
    <rect width="416" height="152" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <line x1="0" y1="34" x2="416" y2="34" stroke="#1e293b"/>
    <text x="16" y="22" fill="#e2e8f0" font-size="12" font-weight="700">Performance — RJTT Tokyo Haneda</text>
    <text x="398" y="22" fill="#64748b" font-size="13" text-anchor="end">✕</text>
    <g transform="translate(16,46)" font-size="10.5">
      <rect width="184" height="26" rx="7" fill="#0f1a2e"/>
      <circle cx="14" cy="13" r="6" fill="#10b981" opacity="0.3"/><path d="M11 13 l2 2 4 -4.5" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="17" fill="#cbd5e1">Static aircraft</text>
      <g transform="translate(200,0)">
        <rect width="184" height="26" rx="7" fill="#0f1a2e"/>
        <circle cx="14" cy="13" r="6" fill="#10b981" opacity="0.3"/><path d="M11 13 l2 2 4 -4.5" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
        <text x="26" y="17" fill="#cbd5e1">Animated passengers</text>
      </g>
      <g transform="translate(0,32)">
        <rect width="184" height="26" rx="7" fill="#0f1a2e"/>
        <circle cx="14" cy="13" r="6" fill="none" stroke="#475569" stroke-width="1.5"/>
        <text x="26" y="17" fill="#94a3b8">Dynamic GSE traffic</text>
      </g>
      <g transform="translate(200,32)">
        <rect width="184" height="26" rx="7" fill="#0f1a2e"/>
        <circle cx="14" cy="13" r="6" fill="none" stroke="#475569" stroke-width="1.5"/>
        <text x="26" y="17" fill="#94a3b8">Terminal interior clutter</text>
      </g>
      <g transform="translate(0,68)">
        <rect width="384" height="24" rx="7" fill="#10b981" opacity="0.9"/>
        <text x="192" y="16" fill="#04211a" font-size="10.5" font-weight="700" text-anchor="middle">Aplicar (2 desactivados → +FPS)</text>
      </g>
