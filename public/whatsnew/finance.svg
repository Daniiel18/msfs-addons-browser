<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2e43" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#fg)"/>

  <!-- header -->
  <g transform="translate(28,26)">
    <rect width="22" height="22" rx="5" fill="#0ea5e9" opacity="0.25"/>
    <path d="M4 7 h14 v9 h-14 z" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="32" y="12" fill="#e2e8f0" font-size="16" font-weight="700">Finanzas de aerolíneas</text>
    <text x="32" y="29" fill="#64748b" font-size="11">Mercado, satisfacción del pasajero y cuentas — por cada aerolínea que vuelas</text>
  </g>

  <!-- airline cards -->
  <g transform="translate(28,72)">
    <!-- card 1 -->
    <g>
      <rect width="186" height="116" rx="14" fill="#0b1220" stroke="#1e293b"/>
      <circle cx="24" cy="24" r="13" fill="#1e293b"/>
      <text x="24" y="28" fill="#e2e8f0" font-size="10" font-weight="700" text-anchor="middle">DL</text>
      <text x="46" y="20" fill="#f1f5f9" font-size="12" font-weight="700">Delta Air Lines</text>
      <text x="46" y="34" fill="#38bdf8" font-size="9">Tradicional</text>
      <rect x="120" y="12" width="54" height="16" rx="8" fill="#10b98122"/>
      <text x="147" y="23" fill="#34d399" font-size="8.5" font-weight="700" text-anchor="middle">▲ Beneficio</text>
      <text x="14" y="62" fill="#64748b" font-size="8">SALDO</text>
      <text x="14" y="78" fill="#f1f5f9" font-size="17" font-weight="800">$32.3B</text>
      <text x="172" y="62" fill="#64748b" font-size="8" text-anchor="end">NETO</text>
      <text x="172" y="78" fill="#34d399" font-size="13" font-weight="700" text-anchor="end">+$3.2M</text>
      <text x="14" y="95" fill="#64748b" font-size="8">Satisfacción</text>
      <text x="172" y="95" fill="#84cc16" font-size="8.5" font-weight="700" text-anchor="end">88% · Buena</text>
      <rect x="14" y="100" width="158" height="5" rx="2.5" fill="#1e293b"/>
      <rect x="14" y="100" width="139" height="5" rx="2.5" fill="#84cc16"/>
    </g>
    <!-- card 2 -->
    <g transform="translate(202,0)">
      <rect width="186" height="116" rx="14" fill="#0b1220" stroke="#1e293b"/>
      <circle cx="24" cy="24" r="13" fill="#1e293b"/>
      <text x="24" y="28" fill="#e2e8f0" font-size="10" font-weight="700" text-anchor="middle">FR</text>
      <text x="46" y="20" fill="#f1f5f9" font-size="12" font-weight="700">Ryanair</text>
      <text x="46" y="34" fill="#fbbf24" font-size="9">Low-cost</text>
      <rect x="126" y="12" width="48" height="16" rx="8" fill="#ef444422"/>
      <text x="150" y="23" fill="#f87171" font-size="8.5" font-weight="700" text-anchor="middle">▼ Pérdidas</text>
      <text x="14" y="62" fill="#64748b" font-size="8">SALDO</text>
      <text x="14" y="78" fill="#f1f5f9" font-size="17" font-weight="800">$24.7B</text>
      <text x="172" y="62" fill="#64748b" font-size="8" text-anchor="end">NETO</text>
      <text x="172" y="78" fill="#f87171" font-size="13" font-weight="700" text-anchor="end">−$0.3M</text>
      <text x="14" y="95" fill="#64748b" font-size="8">Satisfacción</text>
      <text x="172" y="95" fill="#f59e0b" font-size="8.5" font-weight="700" text-anchor="end">64% · Regular</text>
      <rect x="14" y="100" width="158" height="5" rx="2.5" fill="#1e293b"/>
      <rect x="14" y="100" width="101" height="5" rx="2.5" fill="#f59e0b"/>
    </g>
  </g>

  <!-- detail / management strip -->
  <g transform="translate(28,204)">
    <rect width="388" height="128" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="700">Gestión de la aerolínea</text>
    <!-- maintenance btn -->
    <g transform="translate(16,36)">
      <rect width="174" height="34" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <rect x="10" y="8" width="18" height="18" rx="5" fill="#f59e0b22"/>
      <text x="38" y="22" fill="#e2e8f0" font-size="11" font-weight="600">🔧 Mantenimiento</text>
    </g>
    <!-- services btn -->
    <g transform="translate(198,36)">
      <rect width="174" height="34" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <rect x="10" y="8" width="18" height="18" rx="5" fill="#0ea5e922"/>
      <text x="38" y="22" fill="#e2e8f0" font-size="11" font-weight="600">🛎 Servicios a bordo</text>
    </g>
    <text x="16" y="92" fill="#64748b" font-size="9">Ingresos: billetes + extras   ·   Costes: fuel, catering, handling,</text>
    <text x="16" y="106" fill="#64748b" font-size="9">mantenimiento, tasas + facturas GSX reales   ·   carga vs pasajeros</text>
  </g>

  <!-- revenue/cost donut -->
  <g transform="translate(432,204)">
    <rect width="180" height="128" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <text x="14" y="24" fill="#94a3b8" font-size="11" font-weight="700">Ingresos vs Costes</text>
    <circle cx="58" cy="78" r="34" fill="none" stroke="#0ea5e9" stroke-width="13" stroke-dasharray="120 95" transform="rotate(-90 58 78)"/>
    <circle cx="58" cy="78" r="34" fill="none" stroke="#22c55e" stroke-width="13" stroke-dasharray="95 120" stroke-dashoffset="-120" transform="rotate(-90 58 78)"/>
    <g transform="translate(108,52)">
      <rect width="9" height="9" rx="2" fill="#0ea5e9"/><text x="14" y="8" fill="#94a3b8" font-size="9">Billetes</text>
      <rect y="18" width="9" height="9" rx="2" fill="#22c55e"/><text x="14" y="26" fill="#94a3b8" font-size="9">Extras</text>
      <rect y="36" width="9" height="9" rx="2" fill="#ef4444"/><text x="14" y="44" fill="#94a3b8" font-size="9">Combustible</text>
      <rect y="54" width="9" height="9" rx="2" fill="#14b8a6"/><text x="14" y="62" fill="#94a3b8" font-size="9">Mantenim.</text>
    </g>
  </g>
</svg>
