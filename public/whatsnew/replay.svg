<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="rp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a33" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0b1220"/>
  <rect width="640" height="360" fill="url(#rp-bg)"/>

  <g transform="translate(28,26)">
    <text x="0" y="12" fill="#e2e8f0" font-size="16" font-weight="700">Revive tus vuelos: replay sobre el mapa</text>
    <text x="0" y="31" fill="#64748b" font-size="11">Un avión recorre tu trayectoria real · play/pausa, velocidad y arrastra para saltar</text>
  </g>

  <!-- "mapa" con grid + ruta -->
  <g transform="translate(48,66)">
    <rect width="544" height="220" rx="14" fill="#0a1120" stroke="#1e293b"/>
    <g stroke="#16233b" stroke-width="0.6">
      <line x1="0" y1="55" x2="544" y2="55"/><line x1="0" y1="110" x2="544" y2="110"/><line x1="0" y1="165" x2="544" y2="165"/>
      <line x1="136" y1="0" x2="136" y2="220"/><line x1="272" y1="0" x2="272" y2="220"/><line x1="408" y1="0" x2="408" y2="220"/>
    </g>
    <!-- ruta ámbar completa -->
    <path d="M60 170 Q200 40 300 96 T500 60" fill="none" stroke="#f59e0b" stroke-width="2.4" opacity="0.55"/>
    <!-- trail cian recorrido -->
    <path d="M60 170 Q200 40 300 96" fill="none" stroke="#67e8f9" stroke-width="3" />
    <circle cx="60" cy="170" r="5" fill="#38bdf8"/>
    <circle cx="500" cy="60" r="5" fill="#f59e0b"/>
    <!-- avión cian -->
    <g transform="translate(300,96) rotate(35)">
      <path d="M21 16v-2l-8-5V3.5C13 2.67 12.33 2 11.5 2S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" fill="#22d3ee" stroke="#0f172a" stroke-width="0.7" transform="translate(-12,-12) scale(1.4)"/>
    </g>
  </g>

  <!-- barra de control -->
  <g transform="translate(48,296)">
    <rect width="544" height="46" rx="12" fill="#0a1120" stroke="#334155"/>
    <circle cx="30" cy="23" r="14" fill="#06b6d4"/>
    <path d="M26 16 l10 7 -10 7 z" fill="#0f172a"/>
    <rect x="58" y="20" width="330" height="6" rx="3" fill="#1e293b"/>
    <rect x="58" y="20" width="150" height="6" rx="3" fill="#38bdf8"/>
    <circle cx="208" cy="23" r="7" fill="#67e8f9"/>
    <text x="404" y="27" fill="#cbd5e1" font-size="11" font-family="monospace">12:40 / 1:58:10</text>
    <rect x="496" y="14" width="34" height="18" rx="5" fill="#164e63"/><text x="513" y="27" fill="#a5f3fc" font-size="10" text-anchor="middle">120×</text>
  </g>
</svg>
