<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#g2)" opacity="0.5"/>
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a432b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <text x="320" y="56" fill="#e2e8f0" font-size="18" font-weight="700" text-anchor="middle">¿Qué versión de MSFS quieres usar?</text>
  <text x="320" y="80" fill="#94a3b8" font-size="13" text-anchor="middle">Detectadas automáticamente al abrir</text>

  <!-- MSFS 2020 (seleccionado) -->
  <g transform="translate(70,108)">
    <rect width="220" height="170" rx="16" fill="#1e293b" stroke="#1ea45d" stroke-width="2"/>
    <circle cx="190" cy="26" r="11" fill="#1ea45d"/>
    <path d="M185 26 L189 30 L196 22" stroke="#06210f" stroke-width="2.5" fill="none"/>
    <rect x="24" y="34" width="172" height="74" rx="10" fill="#0f172a" stroke="#334155"/>
    <path d="M40 88 C70 60 150 60 180 88" stroke="#3fbf78" stroke-width="3" fill="none"/>
    <circle cx="110" cy="62" r="9" fill="#3fbf78"/>
    <text x="110" y="140" fill="#e2e8f0" font-size="18" font-weight="700" text-anchor="middle">MSFS 2020</text>
    <text x="110" y="160" fill="#3fbf78" font-size="12" text-anchor="middle">instalado</text>
  </g>

  <!-- MSFS 2024 -->
  <g transform="translate(350,108)">
    <rect width="220" height="170" rx="16" fill="#1e293b" stroke="#334155"/>
    <circle cx="190" cy="26" r="11" fill="#0f172a" stroke="#475569"/>
    <rect x="24" y="34" width="172" height="74" rx="10" fill="#0f172a" stroke="#334155"/>
    <path d="M40 88 C70 60 150 60 180 88" stroke="#64748b" stroke-width="3" fill="none"/>
    <circle cx="110" cy="62" r="9" fill="#64748b"/>
    <text x="110" y="140" fill="#cbd5e1" font-size="18" font-weight="700" text-anchor="middle">MSFS 2024</text>
    <text x="110" y="160" fill="#94a3b8" font-size="12" text-anchor="middle">instalado</text>
  </g>

  <text x="320" y="322" fill="#64748b" font-size="13" text-anchor="middle">Filtra escenarios y Community por versión · cámbialo en Ajustes</text>
</svg>
