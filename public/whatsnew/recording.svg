<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#gr)" opacity="0.5"/>
  <defs>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a432b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <text x="40" y="52" fill="#e2e8f0" font-size="18" font-weight="700">Best Landings: graba y puntúa cada toma</text>

  <!-- video card -->
  <g transform="translate(40,80)">
    <rect width="300" height="170" rx="14" fill="#020617" stroke="#334155"/>
    <!-- horizon -->
    <rect x="1" y="100" width="298" height="68" rx="0" fill="#1e293b"/>
    <path d="M30 150 L150 120 L270 150" stroke="#475569" stroke-width="2" fill="none"/>
    <!-- plane -->
    <path d="M150 96 l16 10 l-16 -3 l-16 3 z" fill="#fbbf24"/>
    <!-- REC dot -->
    <circle cx="270" cy="28" r="7" fill="#ef4444"/>
    <text x="284" y="33" fill="#fecaca" font-size="13" font-weight="700">REC</text>
    <text x="20" y="33" fill="#94a3b8" font-size="12">Replay buffer · audio del sistema</text>
  </g>

  <!-- OSD card -->
  <g transform="translate(360,80)">
    <rect width="240" height="170" rx="14" fill="#0b1119" stroke="#1ea45d" stroke-width="1.5"/>
    <text x="120" y="44" fill="#3fbf78" font-size="34" font-weight="800" text-anchor="middle">-142</text>
    <text x="120" y="66" fill="#94a3b8" font-size="13" text-anchor="middle">FPM · 1.18 G</text>
    <g transform="translate(48,86)">
      <rect width="144" height="26" rx="13" fill="#0a432b"/>
      <text x="72" y="18" fill="#8ef0bb" font-size="13" font-weight="700" text-anchor="middle">BUTTER ✓</text>
    </g>
    <text x="120" y="132" fill="#cbd5e1" font-size="12" text-anchor="middle">Viento 240/8 · Pitch 4° · Roll -1°</text>
    <text x="120" y="154" fill="#64748b" font-size="11" text-anchor="middle">OSD instantáneo al tocar pista</text>
  </g>

  <text x="40" y="290" fill="#94a3b8" font-size="13">Captura nativa con audio, sin ffmpeg externo. El clip se guarda solo al aterrizar.</text>
  <text x="40" y="314" fill="#64748b" font-size="12">Galería en el Hangar · favoritos · puntuación FPM por toma.</text>
</svg>
