<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="rd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06281b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#rd-bg)"/>

  <!-- header -->
  <g transform="translate(28,26)">
    <rect width="22" height="22" rx="5" fill="#10b981" opacity="0.22"/>
    <path d="M5 16 l4 -6 l4 4 l5 -8" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="12" fill="#e2e8f0" font-size="16" font-weight="700">Datos reales del sim</text>
    <text x="32" y="29" fill="#64748b" font-size="11">El desgaste sale de tus vuelos: motores, aceite, frenos y neumáticos reales</text>
  </g>

  <!-- aircraft silhouette card -->
  <g transform="translate(28,74)">
    <rect width="200" height="240" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600">N827DN · 737-900ER</text>
    <!-- simple top-view silhouette -->
    <g transform="translate(100,135)" stroke="#3b82f6" stroke-width="2" fill="none">
      <path d="M0 -70 q6 8 6 30 l0 30 l34 22 l0 12 l-34 -10 l0 26 l12 10 l0 8 l-18 -6 l-18 6 l0 -8 l12 -10 l0 -26 l-34 10 l0 -12 l34 -22 l0 -30 q0 -22 6 -30 z"/>
    </g>
    <circle cx="78" cy="200" r="6" fill="#ef4444" opacity="0.85"/>
    <circle cx="122" cy="200" r="6" fill="#f59e0b" opacity="0.85"/>
    <circle cx="66" cy="150" r="6" fill="#f59e0b" opacity="0.7"/>
    <circle cx="134" cy="150" r="6" fill="#22c55e" opacity="0.7"/>
  </g>

  <!-- real telemetry strip + components -->
  <g transform="translate(244,74)">
    <rect width="368" height="64" rx="12" fill="#0b1220" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="20" cy="20" r="5" fill="#34d399"/>
    <text x="34" y="24" fill="#cbd5e1" font-size="12" font-weight="700">Real sim data</text>
    <rect x="138" y="12" width="120" height="16" rx="8" fill="#10b981" opacity="0.18"/>
    <text x="148" y="24" fill="#6ee7b7" font-size="10" font-weight="700">22 vuelos con datos</text>
    <g font-size="10">
      <rect x="14" y="36" width="78" height="18" rx="5" fill="#0f1a2e"/>
      <text x="20" y="49" fill="#64748b">EGT</text><text x="58" y="49" fill="#fbbf24" font-weight="700">912°C</text>
      <rect x="100" y="36" width="78" height="18" rx="5" fill="#0f1a2e"/>
      <text x="106" y="49" fill="#64748b">Aceite</text><text x="150" y="49" fill="#e2e8f0" font-weight="700">138°</text>
      <rect x="186" y="36" width="84" height="18" rx="5" fill="#0f1a2e"/>
      <text x="192" y="49" fill="#64748b">Frenos</text><text x="240" y="49" fill="#fbbf24" font-weight="700">486°C</text>
      <rect x="278" y="36" width="78" height="18" rx="5" fill="#0f1a2e"/>
      <text x="284" y="49" fill="#64748b">Toma</text><text x="322" y="49" fill="#fbbf24" font-weight="700">-742</text>
    </g>

    <!-- component bars -->
    <g transform="translate(0,78)" font-size="11">
      <g transform="translate(0,0)">
        <text x="0" y="10" fill="#cbd5e1">Neumáticos</text><text x="340" y="10" fill="#ef4444" text-anchor="end" font-weight="700">88%</text>
        <rect x="0" y="16" width="368" height="6" rx="3" fill="#1e293b"/><rect x="0" y="16" width="324" height="6" rx="3" fill="#ef4444"/>
      </g>
      <g transform="translate(0,34)">
        <text x="0" y="10" fill="#cbd5e1">Frenos</text><text x="340" y="10" fill="#f59e0b" text-anchor="end" font-weight="700">72%</text>
        <rect x="0" y="16" width="368" height="6" rx="3" fill="#1e293b"/><rect x="0" y="16" width="265" height="6" rx="3" fill="#f59e0b"/>
      </g>
      <g transform="translate(0,68)">
        <text x="0" y="10" fill="#cbd5e1">EGT / motor</text><text x="340" y="10" fill="#eab308" text-anchor="end" font-weight="700">60%</text>
        <rect x="0" y="16" width="368" height="6" rx="3" fill="#1e293b"/><rect x="0" y="16" width="221" height="6" rx="3" fill="#eab308"/>
      </g>
      <g transform="translate(0,102)">
        <text x="0" y="10" fill="#cbd5e1">Aceite</text><text x="340" y="10" fill="#22c55e" text-anchor="end" font-weight="700">40%</text>
        <rect x="0" y="16" width="368" height="6" rx="3" fill="#1e293b"/><rect x="0" y="16" width="147" height="6" rx="3" fill="#22c55e"/>
      </g>
    </g>
  </g>
</svg>
