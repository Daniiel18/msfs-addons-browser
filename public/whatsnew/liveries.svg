<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="lv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0a3a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#lv-bg)"/>

  <!-- addon card correctly tagged LIVERY -->
  <g transform="translate(150,60)">
    <rect width="340" height="240" rx="16" fill="#0b1220" stroke="#1e293b"/>
    <!-- thumbnail -->
    <rect width="340" height="150" rx="16" fill="#243043"/><rect y="130" width="340" height="20" fill="#243043"/>
    <!-- airliner, side view (nose right) with a livery -->
    <g transform="translate(0,-2)">
      <!-- wing (behind), swept back -->
      <path d="M172 84 L126 116 L192 90 Z" fill="#aab6c6"/>
      <!-- fuselage capsule -->
      <path d="M42 78 Q42 62 66 62 L262 62 Q302 62 306 78 Q302 94 262 94 L66 94 Q42 94 42 78 Z" fill="#eef2f7"/>
      <!-- vertical tail fin (livery color) -->
      <path d="M50 80 L38 42 L82 66 Z" fill="#a855f7"/>
      <!-- horizontal stabilizer -->
      <path d="M54 72 L32 64 L62 70 Z" fill="#cbd5e1"/>
      <!-- livery cheatline -->
      <path d="M62 82 L298 80 L298 88 L62 90 Z" fill="#a855f7"/>
      <!-- cockpit window -->
      <path d="M286 71 Q300 72 303 79 Q292 80 282 76 Z" fill="#1e293b"/>
      <!-- passenger windows -->
      <g fill="#334155">
        <circle cx="92" cy="74" r="2.6"/><circle cx="110" cy="74" r="2.6"/><circle cx="128" cy="74" r="2.6"/>
        <circle cx="146" cy="74" r="2.6"/><circle cx="164" cy="74" r="2.6"/><circle cx="182" cy="74" r="2.6"/>
        <circle cx="200" cy="74" r="2.6"/><circle cx="218" cy="74" r="2.6"/><circle cx="236" cy="74" r="2.6"/><circle cx="254" cy="74" r="2.6"/>
      </g>
      <!-- engine pod under the wing -->
      <path d="M150 92 L162 92 L160 100 L152 100 Z" fill="#aab6c6"/>
      <ellipse cx="156" cy="103" rx="18" ry="8" fill="#9aa7b8"/>
      <ellipse cx="174" cy="103" rx="3.5" ry="8" fill="#5b6b7d"/>
    </g>
    <!-- LIVERY tag (correct) -->
    <g transform="translate(14,14)">
      <rect width="78" height="22" rx="6" fill="#a855f7"/>
      <text x="39" y="15" fill="#2e0b45" font-size="10.5" font-weight="800" text-anchor="middle">LIVERY</text>
    </g>
    <!-- title + meta -->
    <text x="18" y="184" fill="#e2e8f0" font-size="14" font-weight="700">PMDG 737-800 · Airline</text>
    <text x="18" y="206" fill="#64748b" font-size="11">Aircraft Liveries</text>
    <!-- corrected from MISC -->
    <g transform="translate(18,216)">
      <rect width="120" height="20" rx="6" fill="#1e293b"/>
      <text x="10" y="14" fill="#64748b" font-size="10" text-decoration="line-through">Sound / Misc</text>
      <path d="M96 6 l8 8 m0 -8 l-8 8" stroke="#f43f5e" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g transform="translate(148,216)">
      <path d="M4 10 l6 6 l12 -14" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="15" fill="#6ee7b7" font-size="11" font-weight="700">LIVERY</text>
    </g>
  </g>
</svg>
