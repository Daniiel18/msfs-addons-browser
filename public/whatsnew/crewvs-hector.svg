<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#gv)" opacity="0.55"/>
  <defs>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0764" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <text x="40" y="52" fill="#e2e8f0" font-size="18" font-weight="700">Crew VS: vuela el mismo plan en directo</text>

  <!-- Héctor card (TÚ) -->
  <g transform="translate(40,80)">
    <rect width="220" height="190" rx="14" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="16" y="16" width="188" height="74" rx="10" fill="#0f172a"/>
    <path d="M110 40 l20 12 l-20 -4 l-20 4 z" fill="#38bdf8"/>
    <text x="190" y="36" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="end">TÚ</text>
    <text x="20" y="116" fill="#38bdf8" font-size="15" font-weight="700">Capitán Héctor</text>
    <text x="20" y="138" fill="#cbd5e1" font-size="12">A21N · EC-NXH</text>
    <g transform="translate(16,150)">
      <text x="0" y="14" fill="#64748b" font-size="11">ALT 18.020 ft · GS 412 kt</text>
      <text x="0" y="32" fill="#8ef0bb" font-size="12" font-weight="700">A 248 nm · LÍDER</text>
    </g>
  </g>

  <!-- VS -->
  <text x="320" y="185" fill="#e879f9" font-size="34" font-weight="900" text-anchor="middle">VS</text>

  <!-- Daniel card -->
  <g transform="translate(380,80)">
    <rect width="220" height="190" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="16" y="16" width="188" height="74" rx="10" fill="#0f172a"/>
    <path d="M110 40 l20 12 l-20 -4 l-20 4 z" fill="#fb7185"/>
    <text x="20" y="116" fill="#f43f5e" font-size="15" font-weight="700">Capitán Daniel</text>
    <text x="20" y="138" fill="#cbd5e1" font-size="12">A21N · EC-NXG</text>
    <g transform="translate(16,150)">
      <text x="0" y="14" fill="#64748b" font-size="11">ALT 17.400 ft · GS 398 kt</text>
      <text x="0" y="32" fill="#cbd5e1" font-size="12">A 263 nm</text>
    </g>
  </g>

  <!-- race bar -->
  <g transform="translate(40,292)">
    <text x="0" y="-6" fill="#64748b" font-size="11">LEMD</text>
    <text x="560" y="-6" fill="#64748b" font-size="11" text-anchor="end">GCLP</text>
    <rect width="560" height="8" rx="4" fill="#1e293b"/>
    <rect width="360" height="8" rx="4" fill="#38bdf8"/>
    <rect y="14" width="560" height="8" rx="4" fill="#1e293b"/>
    <rect y="14" width="330" height="8" rx="4" fill="#f43f5e"/>
  </g>
</svg>
