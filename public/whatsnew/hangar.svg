<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#gh)" opacity="0.5"/>
  <defs>
    <linearGradient id="gh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a432b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <text x="40" y="52" fill="#e2e8f0" font-size="18" font-weight="700">Hangar: tu flota con analíticas</text>

  <!-- KPIs row -->
  <g transform="translate(40,76)">
    <rect width="130" height="64" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="16" y="28" fill="#64748b" font-size="11">HORAS</text>
    <text x="16" y="50" fill="#3fbf78" font-size="20" font-weight="700">128 h</text>
  </g>
  <g transform="translate(180,76)">
    <rect width="130" height="64" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="16" y="28" fill="#64748b" font-size="11">MILLAS</text>
    <text x="16" y="50" fill="#3fbf78" font-size="20" font-weight="700">42.6k</text>
  </g>
  <g transform="translate(320,76)">
    <rect width="130" height="64" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="16" y="28" fill="#64748b" font-size="11">AVG FPM</text>
    <text x="16" y="50" fill="#3fbf78" font-size="20" font-weight="700">-138</text>
  </g>
  <g transform="translate(460,76)">
    <rect width="140" height="64" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="16" y="28" fill="#64748b" font-size="11">TREN (SALUD)</text>
    <text x="16" y="50" fill="#fbbf24" font-size="20" font-weight="700">86%</text>
  </g>

  <!-- FPM trend chart -->
  <g transform="translate(40,160)">
    <rect width="330" height="160" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="30" fill="#cbd5e1" font-size="13" font-weight="600">FPM Trend (últimos 10)</text>
    <polyline points="20,120 55,95 90,108 125,82 160,100 195,70 230,90 265,60 300,78"
      fill="none" stroke="#3fbf78" stroke-width="2.5"/>
    <g fill="#8ef0bb">
      <circle cx="20" cy="120" r="3"/><circle cx="55" cy="95" r="3"/><circle cx="90" cy="108" r="3"/>
      <circle cx="125" cy="82" r="3"/><circle cx="160" cy="100" r="3"/><circle cx="195" cy="70" r="3"/>
      <circle cx="230" cy="90" r="3"/><circle cx="265" cy="60" r="3"/><circle cx="300" cy="78" r="3"/>
    </g>
  </g>

  <!-- landing gear health -->
  <g transform="translate(390,160)">
    <rect width="210" height="160" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="30" fill="#cbd5e1" font-size="13" font-weight="600">Landing Gear Health</text>
    <!-- simple gear silhouette -->
    <g transform="translate(70,52)" stroke="#94a3b8" stroke-width="3" fill="none">
      <line x1="35" y1="0" x2="35" y2="42"/>
      <circle cx="35" cy="62" r="20" fill="#0f172a" stroke="#fbbf24"/>
      <circle cx="35" cy="62" r="8" fill="#334155"/>
      <line x1="20" y1="6" x2="50" y2="6"/>
    </g>
    <text x="105" y="146" fill="#fbbf24" font-size="22" font-weight="700" text-anchor="middle">86%</text>
  </g>
</svg>
