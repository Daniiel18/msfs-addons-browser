# Template — copia este archivo a `secrets.local.toml` (gitignored)
# y rellena con las credenciales reales de Google Cloud Console
# (OAuth 2.0 Client IDs, tipo "Desktop app"). El build las inyecta
# en el binario vía `option_env!`.
#
# Si dejas `secrets.local.toml` ausente, la app compila pero el flujo
# OAuth de Google Drive queda deshabilitado (mensaje claro al usuario).

SIMFLEET_GOOGLE_CLIENT_ID = "xxx.apps.googleusercontent.com"
SIMFLEET_GOOGLE_CLIENT_SECRET = "GOCSPX-xxx"
