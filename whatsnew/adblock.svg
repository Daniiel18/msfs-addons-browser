<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e1a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#ab-bg)"/>

  <!-- browser window with blocked ads -->
  <g transform="translate(60,52)">
    <rect width="360" height="256" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <rect width="360" height="36" rx="14" fill="#111c2e"/><rect y="22" width="360" height="14" fill="#111c2e"/>
    <circle cx="20" cy="18" r="4.5" fill="#334155"/><circle cx="36" cy="18" r="4.5" fill="#334155"/><circle cx="52" cy="18" r="4.5" fill="#334155"/>
    <!-- content -->
    <rect x="20" y="52" width="220" height="12" rx="6" fill="#233043"/>
    <rect x="20" y="74" width="320" height="8" rx="4" fill="#1a2537"/>
    <rect x="20" y="90" width="300" height="8" rx="4" fill="#1a2537"/>
    <!-- blocked ad slot 1 -->
    <g transform="translate(20,116)">
      <rect width="320" height="52" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 5"/>
      <line x1="8" y1="8" x2="312" y2="44" stroke="#f43f5e" stroke-width="1.6" opacity="0.5"/>
    </g>
    <rect x="20" y="180" width="280" height="8" rx="4" fill="#1a2537"/>
    <rect x="20" y="196" width="320" height="8" rx="4" fill="#1a2537"/>
    <!-- blocked ad slot 2 (sticky) -->
    <g transform="translate(20,218)">
      <rect width="320" height="26" rx="6" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 5"/>
      <line x1="8" y1="6" x2="312" y2="20" stroke="#f43f5e" stroke-width="1.6" opacity="0.5"/>
    </g>
  </g>

  <!-- shield -->
  <g transform="translate(452,110)">
    <path d="M70 0 L134 24 V70 C134 116 106 144 70 156 C34 144 6 116 6 70 V24 Z" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
    <path d="M44 74 l20 22 l38 -46" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="140" fill="#6ee7b7" font-size="13" font-weight="800" text-anchor="middle">0 ads</text>
  </g>
</svg>
