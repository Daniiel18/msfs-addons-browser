      <rect x="10" y="66" width="120" height="6" rx="3" fill="#475569"/>
      <text x="10" y="88" fill="#94a3b8" font-size="9">⬇ 18,540   ★ 4.9</text>
    </g>
    <!-- card C -->
    <g transform="translate(20,176)">
      <rect width="205" height="96" rx="10" fill="#0e1a2b" stroke="#233043"/>
      <rect width="205" height="58" rx="10" fill="#3a2b40"/><rect y="44" width="205" height="14" fill="#3a2b40"/>
      <path d="M22 46 l28 -22 l18 14 l30 -22 l42 30 z" fill="#5b3a66"/>
      <rect x="10" y="66" width="110" height="6" rx="3" fill="#475569"/>
      <text x="10" y="88" fill="#94a3b8" font-size="9">⬇ 940   ★ 4.5</text>
    </g>
    <!-- card D -->
    <g transform="translate(235,176)">
      <rect width="205" height="96" rx="10" fill="#0e1a2b" stroke="#233043"/>
      <rect width="205" height="58" rx="10" fill="#2b3540"/><rect y="44" width="205" height="14" fill="#2b3540"/>
      <path d="M20 46 l30 -24 l18 14 l30 -22 l44 32 z" fill="#3d4b5a"/>
      <rect x="10" y="66" width="98" height="6" rx="3" fill="#475569"/>
      <text x="10" y="88" fill="#94a3b8" font-size="9">⬇ 610   ★ 4.2</text>
