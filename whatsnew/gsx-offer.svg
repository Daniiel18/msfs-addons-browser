    </g>
    <!-- card B: Most popular -->
    <g transform="translate(235,72)">
      <rect width="205" height="96" rx="10" fill="#0e1a2b" stroke="#233043"/>
      <rect width="205" height="58" rx="10" fill="#243b2b"/><rect y="44" width="205" height="14" fill="#243b2b"/>
      <path d="M18 46 l30 -24 l20 16 l28 -20 l44 32 z" fill="#3f6b34"/>
      <rect x="10" y="8" width="92" height="16" rx="5" fill="#f59e0b"/>
      <path d="M20 12 a4 4 0 0 1 3 6 a3 3 0 0 0 -6 0 a4 4 0 0 1 3 -6 z" fill="#7c2d12"/>
