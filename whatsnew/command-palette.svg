<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a33" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#cp-bg)"/>

  <g transform="translate(28,26)">
    <text x="0" y="12" fill="#e2e8f0" font-size="16" font-weight="700">Búsqueda global — pulsa Ctrl + K en cualquier pantalla</text>
    <text x="0" y="31" fill="#64748b" font-size="11">Salta entre vistas, a un addon instalado, o busca en el catálogo · todo con el teclado</text>
  </g>

  <g transform="translate(96,72)">
    <rect width="448" height="248" rx="16" fill="#0a0f1c" stroke="#334155"/>
    <!-- input -->
    <g transform="translate(20,18)">
      <circle cx="10" cy="14" r="7" fill="none" stroke="#64748b" stroke-width="2"/><line x1="15" y1="19" x2="21" y2="25" stroke="#64748b" stroke-width="2"/>
      <text x="34" y="19" fill="#e2e8f0" font-size="14">lebl</text>
      <rect x="360" y="4" width="44" height="20" rx="5" fill="#0f172a" stroke="#334155"/><text x="382" y="18" fill="#64748b" font-size="10" text-anchor="middle">Esc</text>
    </g>
    <line x1="0" y1="52" x2="448" y2="52" stroke="#1e293b"/>
    <!-- results -->
    <g transform="translate(12,64)" font-size="12">
      <rect width="424" height="34" rx="8" fill="#1e293b"/>
      <circle cx="24" cy="17" r="7" fill="none" stroke="#38bdf8" stroke-width="2"/><line x1="29" y1="22" x2="34" y2="27" stroke="#38bdf8" stroke-width="2"/>
      <text x="46" y="21" fill="#e2e8f0">Buscar “lebl” en el catálogo</text>
      <text x="410" y="21" fill="#64748b" text-anchor="end">↵</text>
    </g>
    <g transform="translate(12,104)" font-size="12">
      <text x="34" y="16" fill="#e2e8f0">LEBL — Barcelona El Prat</text>
      <text x="46" y="30" fill="#64748b" font-size="10">LEBL · ver en el mapa</text>
    </g>
    <g transform="translate(12,148)" font-size="12">
      <text x="34" y="16" fill="#e2e8f0">Mapa (escenarios)</text>
    </g>
    <g transform="translate(12,180)" font-size="12">
      <text x="34" y="16" fill="#e2e8f0">FlightBook</text>
    </g>
    <g transform="translate(12,212)" font-size="12">
      <text x="34" y="16" fill="#e2e8f0">Ajustes</text>
    </g>
    <!-- iconitos -->
    <circle cx="26" cy="118" r="7" fill="#22d3ee" opacity="0.3"/>
    <rect x="20" y="156" width="12" height="12" rx="3" fill="#64748b"/>
    <rect x="20" y="188" width="12" height="12" rx="3" fill="#64748b"/>
    <circle cx="26" cy="222" r="6" fill="#64748b"/>
  </g>
</svg>
