<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="fb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f49" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#fb-bg)"/>

  <!-- browser window -->
  <g transform="translate(70,44)">
    <rect width="500" height="272" rx="16" fill="#0b1220" stroke="#1e293b"/>
    <!-- title bar -->
    <rect width="500" height="44" rx="16" fill="#111c2e"/>
    <rect y="28" width="500" height="16" fill="#111c2e"/>
    <circle cx="22" cy="22" r="5" fill="#334155"/>
    <circle cx="40" cy="22" r="5" fill="#334155"/>
    <circle cx="58" cy="22" r="5" fill="#334155"/>
    <rect x="86" y="12" width="330" height="20" rx="10" fill="#0b1220" stroke="#233043"/>
    <circle cx="100" cy="22" r="3.5" fill="none" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="114" y="26" fill="#7dd3fc" font-size="11" font-weight="600">flightsim.to</text>
    <!-- logged-in avatar -->
    <circle cx="470" cy="22" r="11" fill="#0ea5e9"/>
    <circle cx="470" cy="18" r="4" fill="#082f49"/>
    <path d="M462 30 a8 8 0 0 1 16 0 z" fill="#082f49"/>

    <!-- addon cards -->
    <g transform="translate(20,60)">
      <g>
        <rect width="140" height="90" rx="10" fill="#0e1a2b" stroke="#233043"/>
        <rect width="140" height="54" rx="10" fill="#1e3a5f"/><rect y="40" width="140" height="14" fill="#1e3a5f"/>
        <path d="M20 40 l18 -16 l14 12 l20 -22 l30 26 z" fill="#2b5a8c"/>
        <circle cx="112" cy="18" r="9" fill="#f59e0b"/><path d="M108 18 l3 3 l6 -7" stroke="#0f172a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <rect x="12" y="64" width="90" height="6" rx="3" fill="#334155"/>
        <rect x="12" y="76" width="60" height="5" rx="2.5" fill="#233043"/>
      </g>
      <g transform="translate(158,0)">
        <rect width="140" height="90" rx="10" fill="#0e1a2b" stroke="#233043"/>
        <rect width="140" height="54" rx="10" fill="#334a2b"/><rect y="40" width="140" height="14" fill="#334a2b"/>
        <path d="M14 42 l24 -20 l18 14 l26 -18 l24 24 z" fill="#4d7a34"/>
        <rect x="12" y="64" width="100" height="6" rx="3" fill="#334155"/>
        <rect x="12" y="76" width="54" height="5" rx="2.5" fill="#233043"/>
      </g>
      <g transform="translate(316,0)">
        <rect width="140" height="90" rx="10" fill="#0e1a2b" stroke="#233043"/>
        <rect width="140" height="54" rx="10" fill="#4a2b3a"/><rect y="40" width="140" height="14" fill="#4a2b3a"/>
        <path d="M18 44 l20 -18 l16 12 l22 -16 l26 22 z" fill="#7a3458"/>
        <rect x="12" y="64" width="86" height="6" rx="3" fill="#334155"/>
        <rect x="12" y="76" width="66" height="5" rx="2.5" fill="#233043"/>
      </g>
    </g>

    <!-- download button + auto-install (icons only, language-neutral) -->
    <g transform="translate(20,166)">
      <rect width="150" height="40" rx="10" fill="#0ea5e9"/>
      <path d="M28 12 v14 m-6 -6 l6 6 l6 -6" stroke="#082f49" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="25" fill="#082f49" font-size="13" font-weight="700">Download</text>
      <g transform="translate(172,8)">
        <path d="M4 12 l6 6 l14 -16" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- folder icon -->
        <path d="M40 6 h10 l4 5 h20 a3 3 0 0 1 3 3 v12 a3 3 0 0 1 -3 3 H40 a3 3 0 0 1 -3 -3 V9 a3 3 0 0 1 3 -3 z" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M50 20 v8 m-4 -4 l4 4 l4 -4" stroke="#6ee7b7" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
