      <g transform="translate(0,60)"><circle cx="8" cy="8" r="5" fill="#34d399"/><text x="24" y="12" fill="#cbd5e1">AIRAC al día (2607)</text></g>
      <g transform="translate(0,90)"><circle cx="8" cy="8" r="5" fill="#34d399"/><text x="24" y="12" fill="#cbd5e1">MSFS detectado y en ejecución</text></g>
      <g transform="translate(0,120)"><circle cx="8" cy="8" r="5" fill="#38bdf8"/><text x="24" y="12" fill="#cbd5e1">Plan de vuelo LEMD → LEBL</text></g>
    </g>
