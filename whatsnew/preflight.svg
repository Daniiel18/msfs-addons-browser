      <circle cx="26" cy="22" r="13" fill="#10b981" opacity="0.25"/>
      <path d="M20 22 l5 5 8 -10" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="20" fill="#a7f3d0" font-size="13" font-weight="800">¡Casi listo! · 1 punto por revisar</text>
      <text x="50" y="36" fill="#6ee7b7" font-size="11" font-family="monospace">LEMD → LEBL · A320</text>
