<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="cv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0a3a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="cv-map" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="1" stop-color="#0a121f"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#cv-bg)"/>

  <!-- header -->
  <g transform="translate(28,26)">
    <rect width="22" height="22" rx="5" fill="#d946ef" opacity="0.22"/>
    <path d="M6 16 L14 8 M9 5 l5 0 0 5 M7 13 l-2 4 4 -2" fill="none" stroke="#f0abfc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="12" fill="#e2e8f0" font-size="16" font-weight="700">Crew VS: histórico por vuelo + rival en el mapa</text>
    <text x="32" y="29" fill="#64748b" font-size="11">Cada vuelo guarda su duelo · sigue a tu rival en vivo</text>
  </g>

  <!-- left: flight list w/ Crew VS badge -->
  <g transform="translate(28,72)">
    <rect width="248" height="252" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <text x="16" y="26" fill="#64748b" font-size="9" font-weight="700" letter-spacing="1">BITÁCORA</text>
    <!-- selected flight -->
    <g transform="translate(12,38)">
      <rect width="224" height="56" rx="10" fill="#2a0e2e" stroke="#a21caf"/>
      <text x="14" y="24" fill="#e2e8f0" font-size="13" font-weight="700">DHL1782</text>
      <text x="14" y="42" fill="#94a3b8" font-size="10">EDDP → VHHH · A330F</text>
      <rect x="146" y="16" width="66" height="22" rx="11" fill="#d946ef"/>
      <text x="179" y="31" fill="#fff" font-size="9.5" font-weight="700" text-anchor="middle">Crew VS</text>
    </g>
    <g transform="translate(12,104)" font-size="10">
      <rect width="224" height="44" rx="10" fill="#0f1a2e"/>
      <text x="14" y="20" fill="#cbd5e1" font-size="12" font-weight="600">GIA5654</text>
      <text x="14" y="36" fill="#64748b">WIII → OMDB · B77W</text>
      <text x="212" y="27" fill="#475569" font-size="9" text-anchor="end">sin duelo</text>
    </g>
    <g transform="translate(12,156)" font-size="10">
      <rect width="224" height="44" rx="10" fill="#0f1a2e"/>
      <text x="14" y="20" fill="#cbd5e1" font-size="12" font-weight="600">KLM641</text>
      <text x="14" y="36" fill="#64748b">EHAM → KJFK · B789</text>
      <rect x="150" y="13" width="62" height="20" rx="10" fill="#a21caf" opacity="0.35"/>
      <text x="181" y="27" fill="#f0abfc" font-size="9" text-anchor="middle" font-weight="700">Crew VS</text>
    </g>
    <!-- ready toast -->
    <g transform="translate(12,208)">
      <rect width="224" height="34" rx="9" fill="#172554" stroke="#1d4ed8"/>
      <circle cx="20" cy="17" r="7" fill="#22c55e"/><path d="M17 17 l2.5 2.5 4 -5" fill="none" stroke="#04210f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="21" fill="#bfdbfe" font-size="10" font-weight="600">Crew VS listo — DHL1782</text>
    </g>
  </g>

  <!-- right: mini map with rival trail + follow -->
  <g transform="translate(292,72)">
    <rect width="320" height="252" rx="14" fill="url(#cv-map)" stroke="#1e293b"/>
    <!-- graticule -->
    <g stroke="#1c2e44" stroke-width="1" opacity="0.6">
      <line x1="0" y1="84" x2="320" y2="84"/><line x1="0" y1="168" x2="320" y2="168"/>
      <line x1="107" y1="0" x2="107" y2="252"/><line x1="213" y1="0" x2="213" y2="252"/>
    </g>
    <!-- own track (cyan) -->
    <path d="M40 210 C 110 180, 150 150, 210 110" fill="none" stroke="#38bdf8" stroke-width="2.4"/>
    <g transform="translate(210,110) rotate(45)"><path d="M0 -9 L6 7 L0 3 L-6 7 Z" fill="#7dd3fc"/></g>
    <!-- rival track (fuchsia, dashed) + glow -->
    <path d="M64 70 C 120 95, 175 120, 248 175" fill="none" stroke="#e879f9" stroke-width="6" opacity="0.3"/>
    <path d="M64 70 C 120 95, 175 120, 248 175" fill="none" stroke="#f0abfc" stroke-width="2.4" stroke-dasharray="4 3"/>
    <g transform="translate(248,175) rotate(135)" filter="drop-shadow(0 0 5px #e879f9)"><path d="M0 -9 L6 7 L0 3 L-6 7 Z" fill="#f5d0fe"/></g>
    <!-- follow chip -->
    <g transform="translate(14,14)">
      <rect width="150" height="26" rx="13" fill="#2a0e2e" stroke="#d946ef"/>
      <circle cx="18" cy="13" r="5" fill="none" stroke="#f0abfc" stroke-width="1.6"/><circle cx="18" cy="13" r="1.6" fill="#f0abfc"/>
      <text x="32" y="17" fill="#f5d0fe" font-size="10" font-weight="700">Siguiendo a Héctor</text>
    </g>
    <!-- rival panel mini -->
    <g transform="translate(176,196)">
      <rect width="132" height="44" rx="9" fill="#1a0a20" stroke="#a21caf"/>
      <text x="10" y="18" fill="#f0abfc" font-size="10" font-weight="700">Héctor · volando</text>
      <text x="10" y="34" fill="#94a3b8" font-size="9">A330F · 35.000 ft · 458 kt</text>
    </g>
  </g>
</svg>
