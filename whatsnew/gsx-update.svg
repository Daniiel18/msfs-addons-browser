<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="gsx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f49" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0f172a"/>
  <rect width="640" height="360" fill="url(#gsx-bg)"/>

  <!-- header -->
  <g transform="translate(28,26)">
    <rect width="22" height="22" rx="5" fill="#06b6d4" opacity="0.22"/>
    <path d="M11 4 a6 6 0 0 1 6 6 v3 l2 3 H3 l2 -3 v-3 a6 6 0 0 1 6 -6 z" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="32" y="12" fill="#e2e8f0" font-size="16" font-weight="700">Avisos de actualización de GSX</text>
    <text x="32" y="29" fill="#64748b" font-size="11">Te avisa cuando hay update y abre el FSDT Installer por ti</text>
  </g>

  <!-- notification card -->
  <g transform="translate(150,80)">
    <rect width="340" height="120" rx="14" fill="#0b1220" stroke="#155e75"/>
    <rect x="18" y="20" width="34" height="34" rx="9" fill="#06b6d4" opacity="0.18"/>
    <path d="M35 28 a5 5 0 0 1 5 5 v3 l1.6 2.4 H28.4 L30 38 v-3 a5 5 0 0 1 5 -5 z" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="46" cy="24" r="5" fill="#f43f5e"/><text x="46" y="27.5" fill="#fff" font-size="7" font-weight="700" text-anchor="middle">1</text>
    <text x="66" y="34" fill="#e2e8f0" font-size="13" font-weight="700">GSX Pro 4.1.0 disponible</text>
    <text x="66" y="52" fill="#94a3b8" font-size="10.5">Tienes la 4.0.5 — hay una nueva versión.</text>
    <rect x="66" y="66" width="150" height="30" rx="8" fill="#06b6d4"/>
    <text x="141" y="86" fill="#062c38" font-size="11" font-weight="700" text-anchor="middle">Abrir FSDT Installer</text>
  </g>

  <!-- safety gate warning -->
  <g transform="translate(150,214)">
    <rect width="340" height="64" rx="12" fill="#3a210b" stroke="#b45309"/>
    <path d="M28 18 L40 42 H16 Z" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="28" y="37" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">!</text>
    <text x="56" y="28" fill="#fcd34d" font-size="11.5" font-weight="700">El simulador está abierto</text>
    <text x="56" y="46" fill="#fde68a" font-size="10">No se abre el instalador hasta que cierres MSFS.</text>
  </g>
</svg>
